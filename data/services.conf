##################################################
# Archivo de configuracion para la red iRC-Peru
# Ultima modificacion: 28/06/2012
# Por: LuizEnciso <LuizEnciso@gmail.com>


RemoteServer    127.0.0.1 3220 "nodo_passwd"
ServerName      "servicios.irc-peru.org"
ServerDesc      "Servicios de la Red iRC-Peru"
ServiceUser     "-@-"
NetworkDomain   "irc-peru.org"
NetworkName	"iRC-Peru"
EnableDebug
JailChan        "#Sumidero"
ClaveCifrado    "ElPutoAmo"

ContactEmail    info@irc-peru.org
CSMaxReg        5
MSIgnoreMax     32
MSMaxMemos      20


Umask           077


LogFilename     services.log
PIDFilename     services.pid
MOTDFilename    services.motd
LockFilename    .lock


StrictPasswords
BadPassLimit    5
BadPassTimeout  1h
BadPassWarning  5
IgnoreDecay     5
IgnoreThreshold 0.1
UpdateTimeout   5m
WarningTimeout  4h
ReadTimeout     3
TimeoutCheck    1.0
NetBufferSize   4194304 1048576  # 4MB and 1MB
NetBufferLimit  80 95


EncryptionType  md5
GuestNickPrefix "Invitado-"
RejectEmail     *@hotmail.us *@latinmail.com
DefTimeZone     America/Lima
ListMax         50
LogMaxUsers


LoadModule protocol/hispano-p9
LoadModule encryption/md5
LoadModule database/standard
LoadModule operserv/main
LoadModule operserv/akill
LoadModule adminserv/main
LoadModule ddbserv/main
LoadModule debugserv/main
LoadModule nickserv/main
LoadModule hostserv/main
LoadModule chanserv/main
LoadModule chanserv/access-levels
LoadModule cregserv/main
LoadModule memoserv/main
LoadModule memoserv/ignore
#LoadModule statserv/main
LoadModule misc/helpserv


# Fin del archivo de configuracion
