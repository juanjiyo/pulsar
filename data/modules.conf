Module operserv/main
    OperServName    "OPeR" "Operator Server"
    GlobalName      "GLOBAL" "Global Noticer"
    ServicesRoot    LuizEnciso
    WallBadOS
    WallOSChannel
EndModule


Module operserv/akill
    AutokillReason  "AKILL: %s"
    AutokillExpiry  30d
    AkillChanExpiry 7d
    OperMaxExpiry   7d
    ImmediatelySendAutokill
EndModule


Module adminserv/main
    AdminServName   "AdminServ" "Administrator Server"
EndModule


Module ddbserv/main
    DdbServName     "DdbServ" "BDD Server"
EndModule


Module debugserv/main
    DebugServName   "Debug" "Debug Server"
    LogChannel	    "#Debug"
EndModule


Module nickserv/main
    NickServName    "NiCK" "Nickname Server"
    NSEnableRegister
    NSRegEmailMax   4
    NSRegIPMax      3
    NSRequireEmail
    NSRegDenyIfSuspended
    NSRegDelay      5m
    #NSInitialRegDelay 60s
    NSSetEmailDelay 5m
    #NSDefKill
    #NSDefKillQuick
    NSDefSecure
    #NSDefPrivate
    #NSDefNoOp
    NSDefHideEmail
    NSDefHideUsermask
    #NSDefHideQuit
    NSDefMemoSignon
    NSDefMemoReceive
    NSExpire        60d
    NSExpireWarning 3d
    NSDropEmailExpire 10m
    NSSuspendExpire 25d 5d
    NSEnforcerUser  enforcer
    NSReleaseTimeout 1m
    NSListOpersOnly
    NSSecureAdmins
    NSHelpWarning
    #NSAlias         ID=IDENTIFY
    SendFrom	NiCK@irc-peru.org
    NetworkWebsite	http://www.irc-peru.org/
EndModule


Module nickserv/link
    NSLinkMax       1
EndModule


Module chanserv/main
    ChanServName    "CHaN" "Channel Server"
    #CSEnableRegister
    #CSRegisteredOnly
    CSDefKeepTopic
    #CSDefSecureOps
    #CSDefPrivate
    #CSDefTopicLock
    #CSDefLeaveOps
    #CSDefSecure
    #CSDefOpNotice
    #CSDefEnforce
    #CSDefMemoRestricted
    CSDefHideEmail
    #CSDefHideTopic
    #CSDefHideMlock
    CSDefModeLock   +nt
    CSExpire        14d
    CSSuspendExpire 12d 2d
    CSShowPassword
    CSAccessMax     1024
    CSAutokickMax   32
    CSInhabit       15s
    #CSRestrictDelay 15s
    CSListOpersOnly
    CSAlias         ID=IDENTIFY
EndModule


Module cregserv/main
     CregServName   "CReG" "Servicio de pre-registro de canales"
     CRSRegNotice   "El canal ha sido registrado debido a que cumplia las normas establecidas de registro de canales. Cualquier ruptura en el seguimiento de estas normas por parte de los usuarios puede dar lugar a la cancelación del canal sin previo aviso ni explicación."
     CRSAntiguedadNick    1m
     CRSSigRegistro 1d
EndModule


