###########################################################################
#
# NickServ configuration
#
###########################################################################

Module nickserv/main

    NickServName    "NiCK" "Nickname Server"

    NSEnableRegister

    NSRegEmailMax   1

    NSRegIPMax    3

    NSRequireEmail

    NSRegDenyIfSuspended

    NSRegDelay      5m

    #NSInitialRegDelay 60s

    NSSetEmailDelay 5m

    #NSDefKill
    #NSDefKillQuick
    NSDefSecure
    #NSDefPrivate
    #NSDefNoOp
    NSDefHideEmail
    NSDefHideUsermask
    #NSDefHideQuit
    NSDefMemoSignon
    NSDefMemoReceive

    NSExpire        60d

    NSExpireWarning 3d

    NSDropEmailExpire 10m

    NSSuspendExpire 25d 5d

    NSEnforcerUser  enforcer

    NSReleaseTimeout 1m

    NSListOpersOnly

    NSSecureAdmins

    NSHelpWarning

    #NSAlias         ID=IDENTIFY

    SendFrom	NiCK@irc-peru.org

    NetworkWebsite	http://www.irc-peru.pe/

EndModule

################################ Link module

Module nickserv/link

    # No Aumentar el valor.
    NSLinkMax       1

EndModule


###########################################################################
#
# ChanServ configuration
#
###########################################################################

Module chanserv/main

    ChanServName    "CHaN" "Channel Server"

    CSEnableRegister

    #CSRegisteredOnly

    CSMaxReg        3

    CSDefKeepTopic
    #CSDefSecureOps
    #CSDefPrivate
    #CSDefTopicLock
    #CSDefLeaveOps
    #CSDefSecure
    #CSDefOpNotice
    #CSDefEnforce
    #CSDefMemoRestricted
    CSDefHideEmail
    #CSDefHideTopic
    #CSDefHideMlock

    CSDefModeLock   +nt

    CSExpire        14d

    CSSuspendExpire 12d 2d

    CSShowPassword

    CSAccessMax     1024

    CSAutokickMax   32

    CSInhabit       15s

    #CSRestrictDelay 15s

    CSListOpersOnly

    CSAlias         ID=IDENTIFY

EndModule

###########################################################################
#
# CregServ configuration
#
###########################################################################

Module cregserv/main

        CregServName    "CReG" "Servicio de pre-registro de canales"

# CRSRegNotice <string>  [REQUERIDO]
#     Estable el mensaje de entrada de un canal registrado.

CRSRegNotice "El canal ha sido registrado debido a que cumplia las normas establecidas de registro de canales. Cualquier ruptura en el seguimiento de estas normas por parte de los usuarios puede dar lugar a la cancelación del canal sin previo aviso ni explicación."

# CRSAntiguedadNick <time>  [REQUERIDO]
#     Establece la antigueda requerida de un nick para poder solicitar el registro de un canal.

CRSAntiguedadNick    7d

# CRSSigRegistro <time>  [REQUERIDO]
# Establece el tiempo minimo de espera para poder registrar otro canal.

CRSSigRegistro 1d

EndModule

